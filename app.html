<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MealMath</title>
<style>
  :root { --bg:#faf7f2; --card:#fff; --ink:#2e2620; --muted:#8a7f74; --orange:#d9732b; --green:#3d8a4f; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:ui-sans-serif,system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:20px 24px 8px; }
  h1 { margin:0; font-size:1.5rem; }
  .sub { color:var(--muted); margin:4px 0 0; font-size:.9rem; }
  main { max-width:720px; margin:0 auto; padding:12px 16px 40px; }
  .card { background:var(--card); border-radius:12px; padding:16px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  label { font-size:.78rem; color:var(--muted); display:block; margin-bottom:4px; }
  textarea { width:100%; min-height:180px; font:inherit; font-family:ui-monospace,monospace; padding:10px; border:1px solid #e2d9cc; border-radius:8px; resize:vertical; }
  input, select, button { font:inherit; padding:8px 10px; border:1px solid #e2d9cc; border-radius:8px; background:#fff; }
  input[type=number] { width:80px; }
  button { background:var(--orange); color:#fff; border:none; cursor:pointer; }
  button.ghost { background:#f1eae0; color:var(--ink); }
  .servings { display:flex; gap:14px; align-items:end; flex-wrap:wrap; margin-top:10px; }
  .presets { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .presets button { padding:5px 12px; font-size:.85rem; }
  ul.out { list-style:none; padding:0; margin:0; }
  ul.out li { padding:8px 4px; border-bottom:1px solid #f0e9de; display:flex; justify-content:space-between; gap:10px; }
  ul.out li:last-child { border-bottom:none; }
  .scaled { font-weight:600; }
  .plain { color:var(--muted); font-style:italic; }
  .empty { color:var(--muted); text-align:center; padding:20px; }
</style>
</head>
<body>
<header>
  <h1>MealMath</h1>
  <p class="sub">Scale any recipe to any servings. Quantities come out as kitchen fractions - 1 1/3 cups, never 1.333.</p>
</header>
<main>
  <div class="card">
    <label for="recipe">Ingredients, one per line (quantities first: "2 cups flour", "3 eggs", "salt to taste")</label>
    <textarea id="recipe" placeholder="2 cups flour&#10;1 1/2 tsp baking powder&#10;3 eggs&#10;100 g sugar&#10;salt to taste"></textarea>
    <div class="servings">
      <div><label>Recipe serves</label><input type="number" id="from" min="0.5" step="0.5" value="4"></div>
      <div><label>I want</label><input type="number" id="to" min="0.5" step="0.5" value="6"></div>
      <button id="scale">Scale it</button>
    </div>
    <div class="presets" id="presets"></div>
  </div>
  <div class="card" id="result" style="display:none">
    <label id="result-label">Scaled ingredients</label>
    <ul class="out" id="out"></ul>
  </div>
</main>
<script src="engine.js"></script>
<script>
(function () {
  var KEY = 'mealmath-v1';
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (saved && saved.recipe) {
    document.getElementById('recipe').value = saved.recipe;
    document.getElementById('from').value = saved.from;
    document.getElementById('to').value = saved.to;
  }

  var presets = [0.5, 1, 1.5, 2, 3];
  var pw = document.getElementById('presets');
  presets.forEach(function (m) {
    var b = document.createElement('button');
    b.className = 'ghost';
    b.textContent = 'x' + m;
    b.onclick = function () {
      var from = parseFloat(document.getElementById('from').value) || 4;
      document.getElementById('to').value = from * m;
      scale();
    };
    pw.appendChild(b);
  });

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function scale() {
    var recipe = document.getElementById('recipe').value;
    var from = document.getElementById('from').value;
    var to = document.getElementById('to').value;
    var out;
    try {
      out = MealMath.scaleRecipe(recipe.split('\n'), from, to);
    } catch (err) { alert(err.message); return; }
    if (!out.length) { document.getElementById('result').style.display = 'none'; return; }
    localStorage.setItem(KEY, JSON.stringify({ recipe: recipe, from: from, to: to }));
    var ul = document.getElementById('out');
    ul.innerHTML = '';
    out.forEach(function (r) {
      var li = el('li');
      li.appendChild(el('span', r.qty === null ? 'plain' : 'scaled', r.text));
      ul.appendChild(li);
    });
    document.getElementById('result-label').textContent =
      'Scaled from ' + from + ' to ' + to + ' servings (x' + (Math.round((to / from) * 100) / 100) + ')';
    document.getElementById('result').style.display = 'block';
  }

  document.getElementById('scale').onclick = scale;
  if (saved && saved.recipe) scale();
})();
</script>
</body>
</html>
